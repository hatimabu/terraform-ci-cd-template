name: Security Scan

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read
  security-events: write

jobs:
  security-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Checkov Terraform Scan
        id: checkov
        uses: bridgecrewio/checkov-action@v12
        continue-on-error: true
        with:
          directory: infra/
          framework: terraform
          output_format: cli,json
          output_file_path: console,checkov-report.json

      - name: Upload Checkov Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checkov-report
          path: checkov-report.json
          if-no-files-found: warn

      - name: Run Trivy IaC Scan
        id: trivy
        uses: aquasecurity/trivy-action@0.36.0
        continue-on-error: true
        with:
          scan-type: config
          scan-ref: infra/
          format: sarif
          output: trivy-iac-results.sarif
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-iac-results.sarif

      - name: Upload Trivy Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-iac-report
          path: trivy-iac-results.sarif
          if-no-files-found: warn

      - name: Fail if Security Scans Failed
        if: steps.checkov.outcome == 'failure' || steps.trivy.outcome == 'failure'
        run: exit 1

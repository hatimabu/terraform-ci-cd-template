name: Terraform Plan

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  terraform-plan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format Check
        run: terraform fmt -check
        working-directory: infra

      - name: Terraform Init
        run: terraform init
        working-directory: infra

      - name: Terraform Validate
        run: terraform validate
        working-directory: infra

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan -no-color -out=tfplan > tfplan.txt 2>&1
          terraform show -no-color tfplan >> tfplan.txt
        working-directory: infra
        continue-on-error: true

      - name: Upload Terraform Plan Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: terraform-plan
          path: |
            infra/tfplan
            infra/tfplan.txt
          if-no-files-found: warn

      - name: Comment Terraform Plan on Pull Request
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const fs = require("fs");
            const marker = "<!-- terraform-plan-comment -->";
            const planPath = "infra/tfplan.txt";
            const outcome = "${{ steps.plan.outcome }}";
            const result = outcome === "success" ? "PASSED" : "FAILED";
            let plan = fs.existsSync(planPath)
              ? fs.readFileSync(planPath, "utf8")
              : "Terraform plan output was not generated.";

            const maxLength = 6000;
            if (plan.length > maxLength) {
              plan = `${plan.slice(0, maxLength)}\n\n...output truncated. Download the terraform-plan artifact for the full plan.`;
            }

            const body = [
              marker,
              `## Terraform Plan ${result}`,
              "",
              `Workflow result: **${outcome}**`,
              "",
              "<details>",
              "<summary>Show plan output</summary>",
              "",
              "```text",
              plan,
              "```",
              "",
              "</details>",
              "",
              "Download the `terraform-plan` workflow artifact for the saved binary plan and full text output."
            ].join("\n");

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });

            const existing = comments.find((comment) =>
              comment.user.type === "Bot" && comment.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }

      - name: Fail if Terraform Plan Failed
        if: steps.plan.outcome == 'failure'
        run: exit 1
